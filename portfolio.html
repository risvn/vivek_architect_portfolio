<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<style>

:root{
    --bg:#f5f1eb;
    --surface:#ffffff;
    --primary:#4d3b2f;
    --secondary:#8d735b;
    --accent:#6d8b55;
    --border:#ddd3c8;
    --text:#2e2b28;
    --muted:#777;
    --shadow:0 10px 30px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* ================= NAVBAR ================= */

nav{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
    background:rgba(245,241,235,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
}

.logo{
    font-size:1.4rem;
    font-weight:700;
    color:var(--primary);
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav a{
    color:var(--text);
    text-decoration:none;
    transition:.3s;
}

nav a:hover{
    color:var(--accent);
}

/* ================= HERO ================= */

.hero{
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:3rem;
    color:var(--primary);
}

.hero p{
    color:var(--muted);
    margin-top:15px;
}

/* ================= GALLERY ================= */

.gallery{
    width:min(1300px,90%);
    margin:40px auto 80px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:.35s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
    cursor:pointer;
    transition:.4s;
}

.card:hover img{
    transform:scale(1.05);
}

.caption{
    padding:20px;
}

.caption h3{
    color:var(--primary);
    margin-bottom:10px;
}

.caption p{
    color:var(--muted);
}

/* ================= OVERLAY ================= */

#overlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(6px);
    z-index:999;
}

#overlay img{
    max-width:85%;
    max-height:80vh;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* buttons */

.close,
.prev,
.next{

    position:absolute;
    width:55px;
    height:55px;

    border:none;
    border-radius:50%;

    background:white;
    color:#333;

    cursor:pointer;
    font-size:28px;

    transition:.3s;
}

.close:hover,
.prev:hover,
.next:hover{

    background:var(--accent);
    color:white;
}

.close{

    top:25px;
    right:30px;
}

.prev{

    left:30px;
    top:50%;
    transform:translateY(-50%);
}

.next{

    right:30px;
    top:50%;
    transform:translateY(-50%);
}

/* ================= FOOTER ================= */

footer{

    text-align:center;
    padding:40px;
    color:var(--muted);
}

@media(max-width:700px){

nav{

    flex-direction:column;
    gap:20px;
}

nav ul{

    gap:18px;
}

.hero h1{

    font-size:2.2rem;
}

.prev,
.next{

    width:45px;
    height:45px;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">floor vista</div>

<ul>

<li><a href="index.html">Home</a></li>



</ul>

</nav>

<section class="hero">

<h1>Portfolio</h1>


</section>

<div class="gallery" id="gallery"></div>

<div id="overlay">

<button class="prev">&#10094;</button>

<img id="largeImage">

<button class="next">&#10095;</button>

<button class="close">&times;</button>

</div>

<footer >
      <p>
        <a href="https://github.com/risvn" target="_blank" rel="noopener noreferrer">
          &copy; 2026 Design by rsvn
        </a>
      </p>
</footer>



<script>

const images=[

"work/img1.jpg",
"work/img2.jpg",
"work/img3.jpg",
"work/img4.jpg",
"work/img5.jpg",
"work/img6.jpg",
"work/img7.jpg",
"work/img8.jpg",
"work/new4.webp",
"work/new3.webp",
"work/new2.webp",
"work/new1.webp",

];

const gallery=document.getElementById("gallery");
let current=0;
images.forEach((src,i)=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<img src="${src}">
<div class="caption">
<h3>Image ${i+1}</h3>
<p>Send me project description</p>
</div>
`;
card.querySelector("img").onclick=()=>openImage(i);
gallery.appendChild(card);
});

const overlay=document.getElementById("overlay");

const big=document.getElementById("largeImage");

function openImage(i){

current=i;

big.src=images[current];

overlay.style.display="flex";

}

function show(){

big.src=images[current];

}

document.querySelector(".next").onclick=()=>{

current=(current+1)%images.length;

show();

};

document.querySelector(".prev").onclick=()=>{

current=(current-1+images.length)%images.length;

show();

};

document.querySelector(".close").onclick=()=>{

overlay.style.display="none";

};

overlay.onclick=(e)=>{

if(e.target===overlay)

overlay.style.display="none";

};

document.addEventListener("keydown",(e)=>{

if(overlay.style.display!=="flex") return;

if(e.key==="ArrowRight") document.querySelector(".next").click();

if(e.key==="ArrowLeft") document.querySelector(".prev").click();

if(e.key==="Escape") document.querySelector(".close").click();

});

</script>

</body>
</html>
